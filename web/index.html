<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="My Invitation - Official Video Invitation Maker. మీ ఆహ్వానాలను.. మనసులకు కలుపుతుంది.">
  <title>My Invitation • Video Invitation Maker</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0E0E12;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      background: #0E0E12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(234, 179, 8, 0.15);
      border-radius: 50%;
      border-top-color: #EAB308;
      animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-gold {
      color: #EAB308;
    }
    .brand-sub {
      font-size: 11px;
      margin-top: 6px;
      color: #94A3B8;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
  <script>
    window.flutterConfiguration = {
      canvasKitBaseUrl: "canvaskit/"
    };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }
    if (window.caches) {
      caches.keys().then(function(keys) {
        for (var k of keys) { caches.delete(k); }
      });
    }

    function removeLoader() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }

    window.addEventListener('flutter-first-frame', removeLoader);
    // Safety fallback to dismiss loader after 3.5s
    setTimeout(removeLoader, 3500);
  </script>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="brand-title">
      <span style="color:#FF2A6D">My</span> <span class="brand-gold">Invitation</span>
    </div>
    <div class="brand-sub">మీ ఆహ్వానాలను.. మనసులకు కలుపుతుంది</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
